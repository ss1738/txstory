# Dependency updates arrive as pull requests and go through CI like any change.
# Policy (CONTRIBUTING.md): only adopt releases at least two weeks old; review
# changelogs for packages that are distributed (react, react-dom, @noble/hashes).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        # Major upgrades need their own compatibility review.
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown:
      default-days: 14
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    cooldown:
      default-days: 14
